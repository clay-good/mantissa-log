title: Regular Interval C2 Beaconing Detected
id: mantissa-ndr-beaconing-regular-001
status: stable
description: >
  Detects connections from an internal host to the same external IP or domain
  at regular intervals, which is a hallmark of C2 implants that "phone home"
  on a timer. The detection computes inter-arrival times between consecutive
  connections from the same source to the same destination, then calculates
  the mean interval and standard deviation. A coefficient of variation
  (stddev/mean) below 0.1 indicates highly regular beaconing. Requires a
  minimum of 10 connections over a 24-hour window to establish a pattern.
  Filters out known legitimate periodic services such as NTP (port 123),
  health checks to known CDN/cloud service IPs, and connections to
  whitelisted domains.
author: Mantissa Security Team
date: 2026-02-07

logsource:
  product: mantissa_ndr
  service: network_flows

detection:
  selection:
    is_internal: false
    direction: outbound
  filter_minimum_connections:
    connection_count|gte: 10
  filter_regular_interval:
    interval_coefficient_of_variation|lt: 0.1
  filter_known_services:
    destination_port|not:
      - 123
  filter_whitelisted_domains:
    destination_domain|not|endswith:
      - '.ntp.org'
      - '.amazonaws.com'
      - '.googleapis.com'
      - '.azure.com'
      - '.windowsupdate.com'
      - '.microsoft.com'
      - '.apple.com'
  condition: selection and filter_minimum_connections and filter_regular_interval and not filter_known_services and not filter_whitelisted_domains

fields:
  - source_ip
  - destination_ip
  - destination_port
  - protocol
  - connection_count
  - mean_interval_seconds
  - stddev_interval_seconds
  - interval_coefficient_of_variation
  - bytes_sent
  - bytes_received
  - first_seen
  - last_seen

falsepositives:
  - Legitimate monitoring or heartbeat services
  - Scheduled backup or sync agents
  - Health check probes to known cloud endpoints
  - NTP synchronisation traffic

level: high

schedule:
  interval: 1h
  lookback: 24h

tags:
  - network
  - beaconing
  - c2
  - attack.command_and_control
  - attack.t1071

references:
  - https://attack.mitre.org/tactics/TA0011/
  - https://attack.mitre.org/techniques/T1071/

query_hint: |
  SELECT
    source_ip,
    destination_ip,
    destination_port,
    protocol,
    COUNT(*) AS connection_count,
    AVG(interval_seconds) AS mean_interval_seconds,
    STDDEV(interval_seconds) AS stddev_interval_seconds,
    CASE WHEN AVG(interval_seconds) > 0
         THEN STDDEV(interval_seconds) / AVG(interval_seconds)
         ELSE 1.0 END AS interval_coefficient_of_variation,
    SUM(bytes_sent) AS total_bytes_sent,
    SUM(bytes_received) AS total_bytes_received,
    MIN(timestamp) AS first_seen,
    MAX(timestamp) AS last_seen
  FROM (
    SELECT
      source_ip,
      destination_ip,
      destination_port,
      protocol,
      bytes_sent,
      bytes_received,
      timestamp,
      EXTRACT(EPOCH FROM (timestamp - LAG(timestamp) OVER (
        PARTITION BY source_ip, destination_ip, destination_port
        ORDER BY timestamp
      ))) AS interval_seconds
    FROM network_flows
    WHERE timestamp >= NOW() - INTERVAL '24 hours'
      AND is_internal = false
      AND direction = 'outbound'
      AND destination_port NOT IN (123)
  ) intervals
  WHERE interval_seconds IS NOT NULL
    AND interval_seconds > 0
  GROUP BY source_ip, destination_ip, destination_port, protocol
  HAVING COUNT(*) >= 10
    AND CASE WHEN AVG(interval_seconds) > 0
             THEN STDDEV(interval_seconds) / AVG(interval_seconds)
             ELSE 1.0 END < 0.1
  ORDER BY interval_coefficient_of_variation ASC
