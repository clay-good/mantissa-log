title: SSH Lateral Movement Detected
id: mantissa-ndr-lateral-ssh-004
status: stable
description: >
  Detects unusual SSH connections between internal hosts. SSH (port 22) is
  commonly used for legitimate remote administration but is also abused for
  lateral movement. This rule triggers when a host makes SSH connections to
  more than 5 new internal destinations in 1 hour that were not contacted
  via SSH in the previous 30 days. This pattern may indicate SSH-based worm
  propagation, stolen SSH key abuse, or manual lateral movement.
author: Mantissa Security Team
date: 2026-02-07

logsource:
  product: mantissa_ndr
  service: network_flows

detection:
  selection:
    is_internal: true
    destination_port: 22
  filter_new_ssh_destinations:
    new_destination_count|gte: 5
  condition: selection and filter_new_ssh_destinations

fields:
  - source_ip
  - new_destination_count
  - total_destination_count
  - destination_ips
  - total_bytes_sent
  - total_bytes_received
  - avg_duration_seconds
  - first_seen
  - last_seen

falsepositives:
  - System administrators managing infrastructure during maintenance windows
  - Automated configuration management tools (Ansible, Chef, Puppet)
  - CI/CD pipelines deploying to multiple servers
  - SSH-based file distribution or synchronisation

level: medium

schedule:
  interval: 1h
  lookback: 1h

tags:
  - network
  - lateral_movement
  - ssh
  - attack.lateral_movement
  - attack.t1021.004

references:
  - https://attack.mitre.org/tactics/TA0008/
  - https://attack.mitre.org/techniques/T1021/004/

query_hint: |
  WITH current_ssh AS (
    SELECT
      source_ip,
      destination_ip,
      COUNT(*) AS connection_count,
      SUM(bytes_sent) AS bytes_sent,
      SUM(bytes_received) AS bytes_received,
      AVG(duration_seconds) AS avg_duration_seconds,
      MIN(timestamp) AS first_seen,
      MAX(timestamp) AS last_seen
    FROM network_flows
    WHERE timestamp >= NOW() - INTERVAL '1 hour'
      AND is_internal = true
      AND destination_port = 22
    GROUP BY source_ip, destination_ip
  ),
  historical_ssh AS (
    SELECT DISTINCT source_ip, destination_ip
    FROM network_flows
    WHERE timestamp >= NOW() - INTERVAL '30 days'
      AND timestamp < NOW() - INTERVAL '1 hour'
      AND is_internal = true
      AND destination_port = 22
  )
  SELECT
    cs.source_ip,
    COUNT(DISTINCT CASE WHEN hs.destination_ip IS NULL
                        THEN cs.destination_ip END) AS new_destination_count,
    COUNT(DISTINCT cs.destination_ip) AS total_destination_count,
    ARRAY_AGG(DISTINCT cs.destination_ip) AS destination_ips,
    SUM(cs.bytes_sent) AS total_bytes_sent,
    SUM(cs.bytes_received) AS total_bytes_received,
    AVG(cs.avg_duration_seconds) AS avg_duration_seconds,
    MIN(cs.first_seen) AS first_seen,
    MAX(cs.last_seen) AS last_seen
  FROM current_ssh cs
  LEFT JOIN historical_ssh hs
    ON cs.source_ip = hs.source_ip
    AND cs.destination_ip = hs.destination_ip
  GROUP BY cs.source_ip
  HAVING COUNT(DISTINCT CASE WHEN hs.destination_ip IS NULL
                             THEN cs.destination_ip END) >= 5
  ORDER BY new_destination_count DESC
