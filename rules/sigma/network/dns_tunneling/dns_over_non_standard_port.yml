title: DNS Traffic on Non-Standard Port
id: mantissa-ndr-dns-tunnel-nonstandard-port-005
status: stable
description: >
  DNS normally uses port 53 (UDP or TCP). DNS traffic on other ports may
  indicate covert channels, DNS-over-HTTPS (DoH) tunnelling, or
  DNS-over-TLS (DoT) tunnelling. While DoH (port 443) and DoT (port 853)
  are increasingly common and often legitimate, they can bypass internal DNS
  monitoring and logging. This rule detects DNS-like query patterns on ports
  other than the standard DNS ports (53, 443 for DoH, 853 for DoT),
  including connections to known public DNS resolver IPs on unexpected ports.
author: Mantissa Security Team
date: 2026-02-07

logsource:
  product: mantissa_ndr
  service: network_flows

detection:
  selection:
    is_internal: false
    direction: outbound
  filter_dns_resolvers:
    destination_ip:
      - '8.8.8.8'
      - '8.8.4.4'
      - '1.1.1.1'
      - '1.0.0.1'
      - '9.9.9.9'
      - '208.67.222.222'
      - '208.67.220.220'
  filter_non_standard_port:
    destination_port|not:
      - 53
      - 443
      - 853
  filter_minimum_connections:
    connection_count|gte: 5
  condition: selection and filter_dns_resolvers and filter_non_standard_port and filter_minimum_connections

fields:
  - source_ip
  - destination_ip
  - destination_port
  - protocol
  - connection_count
  - total_bytes_sent
  - total_bytes_received
  - first_seen
  - last_seen

falsepositives:
  - Custom DNS resolver configurations on non-standard ports
  - DNS testing or debugging tools
  - VPN clients that encapsulate DNS traffic
  - Network appliances with non-standard DNS forwarding

level: low

schedule:
  interval: 1h
  lookback: 1h

tags:
  - network
  - dns
  - dns_tunneling
  - covert_channel
  - attack.command_and_control
  - attack.t1071.004

references:
  - https://attack.mitre.org/tactics/TA0011/
  - https://attack.mitre.org/techniques/T1071/004/

query_hint: |
  SELECT
    source_ip,
    destination_ip,
    destination_port,
    protocol,
    COUNT(*) AS connection_count,
    SUM(bytes_sent) AS total_bytes_sent,
    SUM(bytes_received) AS total_bytes_received,
    MIN(timestamp) AS first_seen,
    MAX(timestamp) AS last_seen
  FROM network_flows
  WHERE timestamp >= NOW() - INTERVAL '1 hour'
    AND is_internal = false
    AND direction = 'outbound'
    AND destination_ip IN (
      '8.8.8.8', '8.8.4.4', '1.1.1.1', '1.0.0.1',
      '9.9.9.9', '208.67.222.222', '208.67.220.220'
    )
    AND destination_port NOT IN (53, 443, 853)
  GROUP BY source_ip, destination_ip, destination_port, protocol
  HAVING COUNT(*) >= 5
  ORDER BY connection_count DESC
