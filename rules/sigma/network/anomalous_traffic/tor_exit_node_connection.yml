title: Connection to Known Tor Exit Node
id: mantissa-ndr-anomaly-tor-005
status: stable
description: >
  Detects connections to IP addresses known to be Tor exit nodes. While Tor
  usage may be legitimate for privacy, it is also used to anonymise command
  and control communications and data exfiltration. This rule queries both
  network_flows and dns_queries against a maintained list of known Tor exit
  node IPs. The list should be updated daily from the Tor Project's exit
  list at check.torproject.org/torbulkexitlist. The rule is designed to work
  with a threat intelligence feed integration that tags known Tor exit node
  IPs in the metadata field.
author: Mantissa Security Team
date: 2026-02-07

logsource:
  product: mantissa_ndr
  service: network_flows

detection:
  selection:
    is_internal: false
    direction: outbound
  filter_tor_indicator:
    threat_category|contains: tor
  filter_tor_ports:
    destination_port:
      - 9001
      - 9030
      - 9050
      - 9051
      - 9150
  condition: selection and (filter_tor_indicator or filter_tor_ports)

fields:
  - source_ip
  - destination_ip
  - destination_port
  - protocol
  - connection_count
  - total_bytes_sent
  - total_bytes_received
  - duration_seconds
  - first_seen
  - last_seen

falsepositives:
  - Legitimate Tor usage for privacy or censorship circumvention
  - Security researchers testing Tor connectivity
  - Tor relay operators (not exit nodes)
  - False IP attribution from outdated exit node lists

level: medium

schedule:
  interval: 1h
  lookback: 1h

tags:
  - network
  - anomalous_traffic
  - tor
  - anonymisation
  - attack.command_and_control
  - attack.t1090.003

references:
  - https://attack.mitre.org/tactics/TA0011/
  - https://attack.mitre.org/techniques/T1090/003/

query_hint: |
  SELECT
    source_ip,
    destination_ip,
    destination_port,
    protocol,
    COUNT(*) AS connection_count,
    SUM(bytes_sent) AS total_bytes_sent,
    SUM(bytes_received) AS total_bytes_received,
    AVG(duration_seconds) AS avg_duration_seconds,
    MIN(timestamp) AS first_seen,
    MAX(timestamp) AS last_seen
  FROM network_flows
  WHERE timestamp >= NOW() - INTERVAL '1 hour'
    AND is_internal = false
    AND direction = 'outbound'
    AND (
      destination_port IN (9001, 9030, 9050, 9051, 9150)
      OR metadata LIKE '%tor_exit%'
      OR threat_category LIKE '%tor%'
    )
  GROUP BY source_ip, destination_ip, destination_port, protocol
  ORDER BY connection_count DESC
