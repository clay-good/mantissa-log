title: Connection to Geographically Suspicious Destination
id: mantissa-ndr-anomaly-geo-003
status: stable
description: >
  Detects connections to external IPs in countries or regions that the
  organisation does not normally communicate with. Geolocation is determined
  using the existing IP geolocation enrichment (MaxMind GeoIP2 from
  src/shared/alerting/enrichment.py). Connections to countries not on the
  configurable allowlist are flagged, with severity elevated when combined
  with other suspicious indicators such as non-standard ports, large data
  transfers, or high-entropy DNS queries. The default allowlist should be
  customised per deployment based on the organisation's normal traffic
  patterns.
author: Mantissa Security Team
date: 2026-02-07

logsource:
  product: mantissa_ndr
  service: network_flows

detection:
  selection:
    is_internal: false
    direction: outbound
  filter_unexpected_country:
    destination_country|not:
      - US
      - CA
      - GB
      - DE
      - FR
      - AU
      - JP
      - NL
      - IE
      - SE
  filter_minimum_connections:
    connection_count|gte: 3
  condition: selection and filter_unexpected_country and filter_minimum_connections

fields:
  - source_ip
  - destination_ip
  - destination_country
  - destination_city
  - destination_port
  - protocol
  - connection_count
  - total_bytes_sent
  - total_bytes_received
  - first_seen
  - last_seen

falsepositives:
  - CDN or cloud services hosted in unexpected countries
  - Business partners or customers in non-allowlisted regions
  - Employee travel or VPN usage from unusual locations
  - Anycast-routed services appearing in unexpected geolocations

level: low

schedule:
  interval: 1h
  lookback: 1h

configuration:
  country_allowlist:
    - US
    - CA
    - GB
    - DE
    - FR
    - AU
    - JP
    - NL
    - IE
    - SE

tags:
  - network
  - anomalous_traffic
  - geographic_anomaly
  - attack.command_and_control

references:
  - https://attack.mitre.org/tactics/TA0011/

query_hint: |
  SELECT
    source_ip,
    destination_ip,
    destination_country,
    destination_city,
    destination_port,
    protocol,
    COUNT(*) AS connection_count,
    SUM(bytes_sent) AS total_bytes_sent,
    SUM(bytes_received) AS total_bytes_received,
    MIN(timestamp) AS first_seen,
    MAX(timestamp) AS last_seen
  FROM network_flows
  WHERE timestamp >= NOW() - INTERVAL '1 hour'
    AND is_internal = false
    AND direction = 'outbound'
    AND destination_country NOT IN (
      'US', 'CA', 'GB', 'DE', 'FR', 'AU', 'JP', 'NL', 'IE', 'SE'
    )
    AND destination_country IS NOT NULL
  GROUP BY source_ip, destination_ip, destination_country,
           destination_city, destination_port, protocol
  HAVING COUNT(*) >= 3
  ORDER BY connection_count DESC
