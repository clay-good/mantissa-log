title: Azure Owner Role Granted at Subscription Scope
id: d1000006-0000-4000-8000-000000000006
status: experimental
description: Detects assignment of the Owner role at the subscription scope.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: azure
  service: activity

detection:
  selection:
    event.action:
      - 'Microsoft.Authorization/roleAssignments/write'
    azure.role_definition.name:
      - 'Owner'
    azure.scope_kind:
      - 'subscription'
  condition: selection

fields:
  - user.email
  - '@timestamp'
  - azure.role_definition.name
  - azure.scope

tags:
  - attack.privilege_escalation
  - attack.t1098

evidence_query: |
  SELECT user.email, azure.role_definition.name, azure.scope, @timestamp FROM azure_activity WHERE user.email = '{user.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
