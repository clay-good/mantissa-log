title: Microsoft 365 Conditional Access Policy Disabled or Deleted
id: d1000009-0000-4000-8000-000000000009
status: experimental
description: Detects disabling or deletion of a Conditional Access policy.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: microsoft365
  service: azureactivedirectory

detection:
  selection:
    event.action:
      - 'Update conditional access policy'
      - 'Delete conditional access policy'
      - 'Disable conditional access policy'
  condition: selection

fields:
  - user.email
  - '@timestamp'
  - microsoft365.target_resource
  - microsoft365.modified_properties

tags:
  - attack.defense_evasion
  - attack.t1556

evidence_query: |
  SELECT user.email, microsoft365.operation, microsoft365.target_resource, @timestamp FROM m365_aad WHERE user.email = '{user.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
