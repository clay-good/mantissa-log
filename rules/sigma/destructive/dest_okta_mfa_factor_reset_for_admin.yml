title: Okta MFA Factor Reset on Privileged Account
id: d1000010-0000-4000-8000-000000000010
status: experimental
description: Detects MFA factor reset performed on an account holding administrative roles.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: okta
  service: system

detection:
  selection:
    event.action:
      - 'user.mfa.factor.reset_all'
      - 'user.mfa.factor.deactivate'
    okta.target.detail.is_admin:
      - true
      - 'true'
  condition: selection

fields:
  - actor.email
  - okta.target.alternate_id
  - '@timestamp'
  - source.ip

tags:
  - attack.credential_access
  - attack.t1556

evidence_query: |
  SELECT actor.email, okta.target.alternate_id, event.action, @timestamp FROM okta_system WHERE okta.target.alternate_id = '{okta.target.alternate_id}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
