title: Microsoft 365 Global Administrator Role Granted
id: d1000002-0000-4000-8000-000000000002
status: experimental
description: Detects assignment of the Entra Global Administrator (Company Administrator) role.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: microsoft365
  service: azureactivedirectory

detection:
  selection:
    event.action:
      - 'Add member to role'
      - 'Add member to role completed'
    microsoft365.modified_properties.NewValue:
      - 'Global Administrator'
      - 'Company Administrator'
  condition: selection

fields:
  - user.email
  - '@timestamp'
  - source.ip
  - microsoft365.operation
  - microsoft365.target

tags:
  - attack.privilege_escalation
  - attack.t1098

evidence_query: |
  SELECT user.email, microsoft365.operation, source.ip, @timestamp FROM m365_aad WHERE user.email = '{user.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
