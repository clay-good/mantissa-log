title: Microsoft 365 Security Defaults Disabled
id: d1000008-0000-4000-8000-000000000008
status: experimental
description: Detects when Entra Security Defaults are turned off.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: microsoft365
  service: azureactivedirectory

detection:
  selection:
    event.action:
      - 'Set Company Information'
      - 'Set IsEnabled'
    microsoft365.target_resource:
      - 'Identity Security Defaults'
    microsoft365.modified_properties.NewValue:
      - 'false'
      - 'False'
      - 'Disabled'
  condition: selection

fields:
  - user.email
  - '@timestamp'
  - source.ip
  - microsoft365.modified_properties

tags:
  - attack.defense_evasion
  - attack.t1556

evidence_query: |
  SELECT user.email, microsoft365.operation, source.ip, @timestamp FROM m365_aad WHERE user.email = '{user.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
