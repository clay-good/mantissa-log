title: AWS CloudTrail Disabled or Deleted
id: d1000020-0000-4000-8000-000000000020
status: experimental
description: Detects CloudTrail trail being stopped, deleted, or having logging disabled.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: aws
  service: cloudtrail

detection:
  selection:
    event.action:
      - 'StopLogging'
      - 'DeleteTrail'
      - 'UpdateTrail'
      - 'PutEventSelectors'
    aws.cloudtrail.event_source:
      - 'cloudtrail.amazonaws.com'
  condition: selection

fields:
  - aws.cloudtrail.user_identity.arn
  - '@timestamp'
  - aws.cloudtrail.request_parameters.name

tags:
  - attack.defense_evasion
  - attack.t1562.008

evidence_query: |
  SELECT aws.cloudtrail.user_identity.arn, event.action,        aws.cloudtrail.request_parameters.name, @timestamp FROM aws_cloudtrail WHERE aws.cloudtrail.user_identity.arn = '{aws.cloudtrail.user_identity.arn}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
