title: AWS S3 Bucket Made Public
id: d1000015-0000-4000-8000-000000000015
status: experimental
description: Detects an S3 bucket being granted public access (ACL or policy).
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: aws
  service: cloudtrail

detection:
  selection:
    event.action:
      - 'PutBucketAcl'
      - 'PutBucketPolicy'
      - 'PutPublicAccessBlock'
      - 'DeletePublicAccessBlock'
    aws.cloudtrail.request_parameters.access_control_policy.grants.grantee.uri:
      - 'http://acs.amazonaws.com/groups/global/AllUsers'
      - 'http://acs.amazonaws.com/groups/global/AuthenticatedUsers'
  condition: selection

fields:
  - aws.cloudtrail.user_identity.arn
  - '@timestamp'
  - aws.cloudtrail.request_parameters.bucket_name

tags:
  - attack.exfiltration
  - attack.impact
  - attack.t1567

evidence_query: |
  SELECT aws.cloudtrail.user_identity.arn, event.action,        aws.cloudtrail.request_parameters.bucket_name, @timestamp FROM aws_cloudtrail WHERE aws.cloudtrail.user_identity.arn = '{aws.cloudtrail.user_identity.arn}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
