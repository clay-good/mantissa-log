title: Okta Super Administrator Role Granted
id: d1000003-0000-4000-8000-000000000003
status: experimental
description: Detects assignment of Okta SUPER_ADMIN to a user or group.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: okta
  service: system

detection:
  selection:
    event.action:
      - 'user.account.privilege.grant'
      - 'group.privilege.grant'
    okta.target.type:
      - 'AdminRole'
    okta.target.detail.role:
      - 'SUPER_ADMIN'
  condition: selection

fields:
  - actor.email
  - '@timestamp'
  - source.ip
  - okta.target.alternate_id
  - okta.target.detail.role

tags:
  - attack.privilege_escalation
  - attack.t1098

evidence_query: |
  SELECT actor.email, event.action, okta.target.alternate_id, @timestamp FROM okta_system WHERE actor.email = '{actor.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
