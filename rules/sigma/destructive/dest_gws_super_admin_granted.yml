title: Google Workspace Super Admin Role Granted
id: d1000001-0000-4000-8000-000000000001
status: experimental
description: Detects assignment of the Workspace Super Admin role, which grants full tenant control.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: google_workspace
  service: admin

detection:
  selection:
    event.action:
      - 'ASSIGN_ROLE'
      - 'DELEGATE_ADMIN_PRIVILEGES'
    google_workspace.events.parameters.ROLE_NAME:
      - '_SEED_ADMIN_ROLE'
      - 'Super Admin'
  condition: selection

fields:
  - actor.email
  - '@timestamp'
  - source.ip
  - google_workspace.events.parameters.USER_EMAIL
  - google_workspace.events.parameters.ROLE_NAME

tags:
  - attack.privilege_escalation
  - attack.t1098
  - attack.persistence

evidence_query: |
  SELECT actor.email, event.action, source.ip, @timestamp FROM gws_admin WHERE actor.email = '{actor.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
