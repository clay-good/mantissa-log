title: GCP Organization Administrator Role Granted
id: d1000005-0000-4000-8000-000000000005
status: experimental
description: Detects grant of roles/resourcemanager.organizationAdmin or owner at the organization scope.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: gcp
  service: iam

detection:
  selection:
    event.action:
      - 'SetIamPolicy'
    gcp.audit.method_name:
      - 'google.cloud.resourcemanager.v1.Organizations.SetIamPolicy'
      - 'SetOrgPolicy'
    gcp.audit.iam_binding.role:
      - 'roles/resourcemanager.organizationAdmin'
      - 'roles/owner'
  condition: selection

fields:
  - actor.email
  - '@timestamp'
  - gcp.audit.method_name
  - gcp.audit.iam_binding.role
  - gcp.audit.resource.name

tags:
  - attack.privilege_escalation
  - attack.t1098

evidence_query: |
  SELECT actor.email, gcp.audit.method_name, gcp.audit.iam_binding.role, @timestamp FROM gcp_audit WHERE actor.email = '{actor.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
