title: Microsoft 365 High-Privilege App Consent
id: d1000019-0000-4000-8000-000000000019
status: experimental
description: Detects admin consent grants to apps requesting high-privilege Graph scopes.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: microsoft365
  service: azureactivedirectory

detection:
  selection:
    event.action:
      - 'Consent to application'
      - 'Add app role assignment grant to user'
    microsoft365.modified_properties.NewValue:
      - 'Mail.ReadWrite'
      - 'Mail.Send'
      - 'Files.ReadWrite.All'
      - 'Sites.FullControl.All'
      - 'Directory.ReadWrite.All'
      - 'AppRoleAssignment.ReadWrite.All'
      - 'RoleManagement.ReadWrite.Directory'
  condition: selection

fields:
  - user.email
  - '@timestamp'
  - microsoft365.target
  - microsoft365.modified_properties

tags:
  - attack.persistence
  - attack.t1098.001

evidence_query: |
  SELECT user.email, microsoft365.operation, microsoft365.target, @timestamp FROM m365_aad WHERE user.email = '{user.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
