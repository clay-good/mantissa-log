title: Microsoft 365 Unified Audit Log Disabled
id: d1000022-0000-4000-8000-000000000022
status: experimental
description: Detects when the Unified Audit Log is disabled at the tenant level.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: microsoft365
  service: exchange

detection:
  selection:
    event.action:
      - 'Set-AdminAuditLogConfig'
    microsoft365.modified_properties.UnifiedAuditLogIngestionEnabled:
      - 'False'
      - 'false'
  condition: selection

fields:
  - user.email
  - '@timestamp'
  - microsoft365.modified_properties

tags:
  - attack.defense_evasion
  - attack.t1562.008

evidence_query: |
  SELECT user.email, microsoft365.operation, microsoft365.modified_properties, @timestamp FROM m365_exchange WHERE user.email = '{user.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
