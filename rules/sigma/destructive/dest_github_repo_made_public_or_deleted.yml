title: GitHub Repository Made Public or Deleted
id: d1000017-0000-4000-8000-000000000017
status: experimental
description: Detects a private repo being flipped to public, or any repository deletion.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: github
  service: audit

detection:
  selection:
    event.action:
      - 'repo.access'
      - 'repo.destroy'
      - 'repo.transfer'
      - 'repository.visibility_changed'
    github.visibility:
      - 'public'
  condition: selection

fields:
  - actor.email
  - '@timestamp'
  - github.repo
  - github.visibility

tags:
  - attack.exfiltration
  - attack.impact
  - attack.t1485

evidence_query: |
  SELECT actor.email, event.action, github.repo, github.visibility, @timestamp FROM github_audit WHERE actor.email = '{actor.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
