title: GCP Audit Log Sink Deleted
id: d1000021-0000-4000-8000-000000000021
status: experimental
description: Detects deletion or disabling of a Logging sink that exports audit logs.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: gcp
  service: logging

detection:
  selection:
    event.action:
      - 'google.logging.v2.ConfigServiceV2.DeleteSink'
      - 'google.logging.v2.ConfigServiceV2.UpdateSink'
  condition: selection

fields:
  - actor.email
  - '@timestamp'
  - gcp.audit.resource.name
  - gcp.audit.method_name

tags:
  - attack.defense_evasion
  - attack.t1562.008

evidence_query: |
  SELECT actor.email, gcp.audit.method_name, gcp.audit.resource.name, @timestamp FROM gcp_audit WHERE actor.email = '{actor.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
