title: AWS Root Account Used
id: d1000004-0000-4000-8000-000000000004
status: experimental
description: Detects activity by the AWS root account, which should be locked away after initial setup.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: aws
  service: cloudtrail

detection:
  selection:
    aws.cloudtrail.user_identity.type:
      - 'Root'
  condition: selection

fields:
  - aws.cloudtrail.user_identity.arn
  - event.action
  - source.ip
  - '@timestamp'

tags:
  - attack.privilege_escalation
  - attack.t1078.004

evidence_query: |
  SELECT event.action, source.ip, aws.cloudtrail.event_source, @timestamp FROM aws_cloudtrail WHERE aws.cloudtrail.user_identity.type = 'Root' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
