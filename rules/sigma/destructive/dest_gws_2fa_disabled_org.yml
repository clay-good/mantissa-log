title: Google Workspace Org-Wide 2-Step Verification Disabled
id: d1000007-0000-4000-8000-000000000007
status: experimental
description: Detects when org-wide 2-Step Verification enforcement is turned off.
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: google_workspace
  service: admin

detection:
  selection:
    event.action:
      - 'ENFORCE_STRONG_AUTHENTICATION'
      - 'CHANGE_TWO_STEP_VERIFICATION_ENROLLMENT_SETTING'
      - 'WEAK_PROGRAMMATIC_LOGIN_SETTINGS_CHANGED'
    google_workspace.events.parameters.NEW_VALUE:
      - 'false'
      - 'DISABLED'
  condition: selection

fields:
  - actor.email
  - '@timestamp'
  - source.ip
  - google_workspace.events.parameters.NEW_VALUE
  - google_workspace.events.parameters.OLD_VALUE

tags:
  - attack.defense_evasion
  - attack.persistence
  - attack.t1556

evidence_query: |
  SELECT actor.email, event.action, source.ip, @timestamp FROM gws_admin WHERE actor.email = '{actor.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
