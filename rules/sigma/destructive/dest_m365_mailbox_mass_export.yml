title: Microsoft 365 Mailbox Mass Export
id: d1000014-0000-4000-8000-000000000014
status: experimental
description: Detects export of mailbox contents at scale (eDiscovery, PST export, or compliance search).
author: Mantissa Log Destructive-Event Pack
date: 2026-05-10
modified: 2026-05-10

logsource:
  product: microsoft365
  service: exchange

detection:
  selection:
    event.action:
      - 'New-ComplianceSearchAction'
      - 'Export mailbox'
      - 'Start-MailboxExportRequest'
  condition: selection

fields:
  - user.email
  - '@timestamp'
  - microsoft365.operation
  - microsoft365.target

tags:
  - attack.exfiltration
  - attack.collection
  - attack.t1114

evidence_query: |
  SELECT user.email, microsoft365.operation, microsoft365.target, @timestamp FROM m365_exchange WHERE user.email = '{user.email}' AND @timestamp BETWEEN '{when}'::timestamp - INTERVAL '60' MINUTE                     AND '{when}'::timestamp + INTERVAL '10' MINUTE ORDER BY @timestamp DESC

falsepositives:
  - Approved emergency-access procedures with prior change-ticket reference
  - Documented break-glass account use during incident response
level: critical
paging: true
paging_destinations:
  - pagerduty
  - slack
  - teams
